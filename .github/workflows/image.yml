name: Server image

# Builds the hosted server image (package + data files), starts it, and checks that it answers
# MCP. Pushes to GitHub Container Registry on version tags and manual runs.
on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, pyproject.toml, uv.lock, "src/**", .github/workflows/image.yml]
    tags: ["v*"]
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, uv.lock, "src/**", .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t "$IMAGE:test" .
      - name: Smoke test
        run: |
          docker run -d --name mcp -p 8080:8080 -e SPAIN_MCP_ALLOWED_HOSTS=localhost:8080 "$IMAGE:test"
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          curl -sf localhost:8080/mcp -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d "$INIT" | tee /tmp/init.json
          grep -q '"spain-open-data"' /tmp/init.json
          CALL='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"crime","arguments":{"place":"Valladolid"}}}'
          curl -sf localhost:8080/mcp -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-06-18' -d "$CALL" | tee /tmp/call.json | head -c 600
          grep -q 'Recorded crime' /tmp/call.json
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/mcp -H 'host: evil.test' -H 'content-type: application/json' -d "$INIT")
          test "$code" = 421
          docker exec mcp sh -c 'ls -la /data /data/walk | head -20'
          docker images "$IMAGE:test" --format '{{.Size}}'
      - name: Logs
        if: always()
        run: docker logs mcp 2>&1 | tail -40 || true
      - name: Push
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          for tag in "$VERSION" latest; do docker tag "$IMAGE:test" "$IMAGE:$tag"; docker push "$IMAGE:$tag"; done
